<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trạm liên kết</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<aside class="sidebar">
  <div class="brand"><span>↗</span> Trạm liên kết</div>
  <nav aria-label="Điều hướng">
    <button id="link-nav" class="selected" aria-current="page">▤ &nbsp; Kho liên kết</button>
    <button id="task-nav">▦ &nbsp; Kế hoạch ngày</button>
  </nav>
  <button id="logout" hidden>Đăng xuất</button>
</aside>
<main>
  <section id="login" class="login">
    <h1>Trạm liên kết</h1><p>Kho website và lịch làm việc cá nhân.</p>
    <form id="login-form"><label>Mật khẩu<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="primary">Đăng nhập</button><p id="login-error" role="alert"></p></form>
  </section>
  <div id="workspace" hidden>
    <section class="hero">
      <div><p class="eyebrow" id="today-label"></p><h1 id="heading">Kho liên kết</h1><p id="intro">Lưu và mở nhanh các website của bạn.</p></div>
      <div class="orbit" aria-hidden="true"><i></i><i></i><i></i><b>↗</b></div>
    </section>
    <p id="notice" role="status" hidden></p>
    <section id="links-panel">
      <div class="toolbar">
        <input type="search" id="search" aria-label="Tìm liên kết" placeholder="Tìm tên, địa chỉ hoặc ghi chú…">
        <select id="categories" aria-label="Danh mục"><option value="">Tất cả danh mục</option></select>
        <button id="new-link" class="primary">＋ Thêm liên kết</button>
      </div>
      <p id="link-count" class="muted"></p>
      <div id="links" class="grid"></div>
    </section>
    <section id="tasks-panel" hidden>
      <div class="toolbar">
        <button id="prev" aria-label="Ngày trước">‹</button>
        <input id="day" type="date" aria-label="Ngày làm việc" required>
        <button id="next" aria-label="Ngày sau">›</button>
        <button id="today">Hôm nay</button>
        <button id="new-task" class="primary">＋ Thêm công việc</button>
      </div>
      <p id="task-count" class="muted"></p>
      <div id="tasks" class="timeline"></div>
    </section>
  </div>
</main>
<dialog id="editor">
  <form id="entry-form">
    <div class="dialog-head"><h2 id="editor-title"></h2><button type="button" id="close" aria-label="Đóng">×</button></div>
    <div id="fields"></div>
    <p id="form-error" role="alert"></p>
    <div class="dialog-actions"><button type="button" id="cancel">Hủy</button><button class="primary" id="save">Lưu</button></div>
  </form>
</dialog>
</body></html>
